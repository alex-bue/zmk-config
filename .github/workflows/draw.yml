on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/draw.yml
      - Justfile
      - flake.*
      - config/**
      - keymap_drawer/**
  pull_request:
    paths:
      - .github/workflows/draw.yml
      - Justfile
      - flake.*
      - config/**
      - keymap_drawer/**

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate keymap drawing
        run: nix develop --command just draw

      - name: Check generated artifacts on PR
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- keymap_drawer/base.yaml keymap_drawer/base.svg

      - name: Commit generated artifacts
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- keymap_drawer/base.yaml keymap_drawer/base.svg; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keymap_drawer/base.yaml keymap_drawer/base.svg
          git commit -m "chore: update keymap drawing"
          git push
