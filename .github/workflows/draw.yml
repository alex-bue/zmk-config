on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build keymap drawer image
        run: docker build -t keymap-drawer-env .

      - name: Generate keymap drawing
        run: make draw

      - name: Check generated artifacts on PR
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- keymap_drawer/base.yaml keymap_drawer/base.svg

      - name: Commit generated artifacts
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- keymap_drawer/base.yaml keymap_drawer/base.svg; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keymap_drawer/base.yaml keymap_drawer/base.svg
          git commit -m "chore: update keymap drawing"
          git push
