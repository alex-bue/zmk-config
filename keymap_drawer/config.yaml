parse_config:
  zmk_additional_includes:
    - ".nix/zmk-helpers/include"
    - "modules/zmk/helpers/include"
    - "zmk-helpers/include"

  zmk_preamble: |
    #include <zmk-helpers/key-labels/34.h>

  preprocess: true

  skip_binding_parsing: false
  sticky_label: sticky
  toggle_label: toggle
  tap_toggle_label: tap-toggle
  layer_legend_map:
    default: Default
    default_layer_mac: Mac
    symbols: Sym
    num: Num
    navigation: Nav
    fn: Fn
    sys: Sys
    wm: WM
  mark_alternate_layer_activators: false
  trans_legend:
    tap: ""
    type: trans

  raw_binding_map:
    "&td_reset": { t: "td_reset" }
    "&bootloader": Boot
    "&td_bootloader": Boot
    "&caps_word": Caps Word
    "&leader": Leader
    "&select_line": Sel Line
    "&tog BASE_MAC": { "t": Mac, "h": toggle }
    "&smart_num": { "t": Smart Num, "h": Nav }
    "&magic_shift": { "t": Magic, "h": "Shift" }
    "&kp LS(TAB)": PWin
    "&swapper": NWin
    "&kp LC(INS)": Copy
    "&kp LC(X)": Cut
    "&kp LS(INS)": Paste
    "&copy_cut": Copy Cut

    "&lpar_lt": { "t": "(", "right": "<" }
    "&rpar_gt": { "t": ")", "right": ">" }

  zmk_remove_keycode_prefix: ["AG"]

  zmk_combos:
    combo_cut: { align: bottom, o: 0.15 }

    combo_copy_mac: { hidden: true }
    combo_paste_mac: { hidden: true }
    combo_cut_mac: { hidden: true }

    combo_caps_word: { align: top, o: 1.15 }
    combo_alt: { draw_separate: true }
    combo_select_line: { draw_separate: true }

  zmk_keycode_map:
    # custom mappings
    LALT: Alt
    RALT: Alt
    LCTRL: Ctrl
    RCTRL: Ctrl
    LGUI: Gui
    RGUI: Gui
    LSHFT: Shift
    RSHFT: Shift

    BSPC: Bspc
    DEL: Del
    ESC: Esc
    ENTER: Enter
    RET: Enter
    SPACE: Spc
    TAB: Tab

    PG_UP: PgUp
    PG_DN: PgDn
    INS: Ins
    HOME: Home
    END: End

    UP: ↑
    DOWN: ↓
    LEFT: ←
    RIGHT: →

    C_MUTE: $$mdi:volume-off$$
    C_PP: $$mdi:play-pause$$
    C_PLAY_PAUSE: $$mdi:play-pause$$
    C_VOL_UP: $$mdi:volume-high$$
    C_VOL_DN: $$mdi:volume-medium$$
    C_NEXT: $$mdi:skip-forward$$
    C_PREV: $$mdi:skip-backward$$
    C_BRI_DN: $$mdi:brightness-5$$
    C_BRI_UP: $$mdi:brightness-7$$

    # defaults
    AMPERSAND: "&"
    AMPS: "&"
    APOS: "'"
    APOSTROPHE: "'"
    ASTERISK: "*"
    ASTRK: "*"
    AT: "@"
    AT_SIGN: "@"
    BACKSLASH: \
    BSLH: \
    CARET: ^
    COLON: ":"
    COMMA: ","
    DLLR: $
    DOLLAR: $
    DOT: .
    DOUBLE_QUOTES: '"'
    DQT: '"'
    EQUAL: "="
    EXCL: "!"
    EXCLAMATION: "!"
    FSLH: /
    GRAVE: "`"
    GREATER_THAN: ">"
    GT: ">"
    HASH: "#"
    LBKT: "["
    LBRC: "{"
    LEFT_BRACE: "{"
    LEFT_BRACKET: "["
    LEFT_PARENTHESIS: (
    LESS_THAN: <
    LPAR: (
    LT: <
    MINUS: "-"
    NON_US_BACKSLASH: \
    NON_US_BSLH: "|"
    NON_US_HASH: "#"
    NUHS: "#"
    PERCENT: "%"
    PERIOD: .
    PIPE: "|"
    PIPE2: "|"
    PLUS: +
    POUND: "#"
    PRCNT: "%"
    QMARK: "?"
    QUESTION: "?"
    RBKT: "]"
    RBRC: "}"
    RIGHT_BRACE: "}"
    RIGHT_BRACKET: "]"
    RIGHT_PARENTHESIS: )
    RPAR: )
    SEMI: ;
    SEMICOLON: ;
    SINGLE_QUOTE: "'"
    SLASH: /
    SQT: "'"
    STAR: "*"
    TILDE: "~"
    TILDE2: "~"
    UNDER: _
    UNDERSCORE: _

draw_config:
  key_w: 65
  key_h: 55

  # padding between keys
  inner_pad_w: 3
  inner_pad_h: 3

  dark_mode: false
  append_colon_to_layer_header: false
  shrink_wide_legends: 6
  glyph_tap_size: 15
  glyph_hold_size: 12
  glyph_shifted_size: 10

  svg_style: |
    svg path { fill: inherit; }

    svg.keymap {
        fill: #2d353b;
        background: #2d353b;
        background-color: #2d353b;
        font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono", "Liberation Mono", monospace;
        font-size: 15px;
        font-kerning: normal;
        text-rendering: optimizeLegibility;
    }

    rect.key {
        fill: #d3c6aa;
        stroke: none;
        stroke-width: 0;
    }

    rect.key, rect.combo, rect.combo-separate {
        stroke: none;
        stroke-width: 0;
    }

    rect.combo, rect.combo-separate {
        fill: #d3c6aa;
        opacity: 0.78;
    }

    rect.held, rect.combo.held {
        fill: #e69875;
    }

    text {
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: 0;
    }

    text.tap {
        font-weight: 600;
    }

    text.hold {
        font-weight: 500;
    }

    text.combo, text.hold, text.shifted, text.left, text.right, text.tl, text.tr, text.bl, text.br {
        font-size: 10px;
    }

    text.combo {
        fill: #2d353b;
        font-weight: 600;
    }

    text.hold, text.bl, text.br {
        text-anchor: middle;
        dominant-baseline: auto;
    }

    text.shifted, text.tl, text.tr {
        text-anchor: middle;
        dominant-baseline: hanging;
    }

    text.left, text.tl, text.bl {
        text-anchor: start;
    }

    text.right, text.tr, text.br {
        text-anchor: end;
    }

    text.layer-activator {
        text-decoration: underline;
        text-decoration-thickness: 1.5px;
        text-underline-offset: 2px;
    }

    text.layer-activator tspan {
        text-decoration: underline;
        text-decoration-thickness: 1.5px;
        text-underline-offset: 2px;
    }

    .keypos-20 text.hold,
    .keypos-30 text.hold,
    .keypos-32 text.hold,
    .keypos-33 text.hold {
        font-size: 12px;
        text-decoration: underline;
        text-decoration-thickness: 1.5px;
        text-underline-offset: 2px;
    }

    text.combo.hold, text.combo.shifted, text.combo.left, text.combo.right {
        font-size: 8px;
        font-weight: 500;
    }

    text.label, text.footer {
        fill: #d3c6aa;
        stroke: #2d353b;
        stroke-width: 4;
        paint-order: stroke;
    }

    text.label {
        font-weight: 700;
        text-anchor: start;
    }

    text.footer {
        text-anchor: end;
        dominant-baseline: auto;
    }

    text.trans {
        fill: #7a8478;
    }

    path.combo {
        stroke: #d3c6aa;
        stroke-width: 2;
        stroke-dasharray: 2, 3;
        opacity: 0.35;
        fill: none;
    }

    .layer-Combos rect.key {
        fill: #9da497;
        opacity: 0.22;
    }

    .layer-Combos rect.key.held {
        fill: #e69875;
        opacity: 1;
    }

    .layer-Combos rect.combo,
    .layer-Combos rect.combo-separate {
        fill: #d3c6aa;
        opacity: 0.82;
    }

    .layer-Combos text.key {
        opacity: 0;
    }

    .layer-Combos text.combo {
        fill: #2d353b;
        opacity: 1;
    }

    .icon-tabler > path {
        fill: inherit;
        stroke: inherit;
        stroke-width: 2;
    }

    .icon-tabler > path[stroke="none"][fill="none"] {
        visibility: hidden;
    }

    .keypos-20 text.hold { fill: #6f9f4a; }
    .keypos-30 text.tap { fill: #c35f2e; }
    .keypos-30 text.hold { fill: #b57614; }
    .keypos-31 text.hold { fill: #2d353b; }
    .keypos-32 text.hold { fill: #a05a9f; }
    .keypos-33 text.hold { fill: #3f8f8a; }

    @media (prefers-color-scheme: dark) {
        svg.keymap {
            fill: #2d353b;
            background: #2d353b;
            background-color: #2d353b;
        }

        rect.key {
            fill: #d3c6aa;
        }

        rect.combo, rect.combo-separate {
            fill: #d3c6aa;
        }

        rect.held, rect.combo.held {
            fill: #e69875;
        }

        text.label, text.footer {
            fill: #d3c6aa;
            stroke: #2d353b;
        }

        text.trans {
            fill: #7a8478;
        }

        path.combo {
            stroke: #d3c6aa;
        }
    }
